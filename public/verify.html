<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Payment - WiTime</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <div class="logo-circle">
            WT
        </div>

        <h1>Verifying Payment</h1>

        <p class="tagline">
            Please complete the M-Pesa payment on your phone.
        </p>

    </div>

    <div class="welcome">

        <h2 id="status">
            Waiting for payment...
        </h2>

        <br>

        <p id="message">
            An STK Push has been sent to your phone.
        </p>

        <br>

        <div id="loader"></div>

    </div>

</div>

<script>

const phone = new URLSearchParams(window.location.search).get("phone");

if(data.status==="success"){

    clearInterval(timer);

    window.location.href=`/connected.html?phone=${phone}`;

}

async function checkPayment() {

    try {

        const response = await fetch(`/check-payment/${phone}`);

        const data = await response.json();

        console.log(data);

        if (data.status === "success") {

            clearInterval(timer);

            document.getElementById("status").innerText =
                "Payment Successful";

            document.getElementById("message").innerText =
                "Connecting you to the internet...";

            document.getElementById("loader").style.display = "none";

            setTimeout(() => {

                window.location.href =
                    `/connected.html?phone=${phone}`;

            }, 2000);

        }

    } catch (err) {

        console.error(err);

    }

}

checkPayment();

</script>

</body>
</html>
