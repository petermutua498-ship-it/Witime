<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WiTime - Administrator Login</title>

    <link rel="stylesheet" href="/css/admin-login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img
            src="/images/logo.png"
            class="logo"
            alt="WiTime"
        >

        <h1>WiTime</h1>

        <p class="subtitle">
            Administrator Login
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <p id="loginMessage"></p>


            <button
                type="submit"
                id="loginButton">

                Login

            </button>

        </form>


        <p class="footer">
            WiTime Administration
        </p>

    </div>

</div>


<script src="/admin/js/admin-login.js"></script>

</body>

</html>
