<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WiTime - Dashboard</title>

    <link rel="stylesheet" href="/css/dashboard.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <img src="/images/logo.png" alt="WiTime Logo">

            <h2>WiTime</h2>

        </div>

        <ul>

            <li class="active">
                🏠 Dashboard
            </li>

            <li onclick="location.href='packages.html'">
                📦 Packages
            </li>

            <li onclick="location.href='users.html'">
                👥 Users
            </li>

            <li onclick="location.href='payments.html'">
                💳 Payments
            </li>

            <li onclick="location.href='reports.html'">
                📈 Reports
            </li>

            <li onclick="location.href='settings.html'">
                ⚙ Settings
            </li>

            <li id="logoutBtn">
                🚪 Logout
            </li>

        </ul>

    </aside>


    <!-- Main -->

    <main class="main">

        <div class="header">

            <h1>Dashboard</h1>

            <div class="admin">

                <span>Administrator</span>

                <img
                    src="/images/admin.png"
                    alt="Admin"
                >

            </div>

        </div>


        <div class="content">

            <!-- Statistics -->

            <div class="cards">

                <div class="card">

                    <h3>👥 Online Users</h3>

                    <h2 id="onlineUsers">0</h2>

                </div>


                <div class="card">

                    <h3>📦 Packages</h3>

                    <h2 id="totalPackages">0</h2>

                </div>


                <div class="card">

                    <h3>💳 Payments Today</h3>

                    <h2 id="paymentsToday">0</h2>

                </div>


                <div class="card">

                    <h3>💰 Revenue Today</h3>

                    <h2 id="revenueToday">
                        KES 0
                    </h2>

                </div>

            </div>


            <!-- Recent Payments -->

            <div class="table-card">

                <h2 style="margin-bottom:20px;">
                    Recent Payments
                </h2>

                <table>

                    <thead>

                        <tr>

                            <th>Phone</th>

                            <th>Package</th>

                            <th>Amount</th>

                            <th>Status</th>

                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="paymentTable">

                        <tr>

                            <td
                                colspan="5"
                                style="text-align:center;"
                            >
                                No payments found.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<!-- Dashboard JavaScript -->

<script src="/admin/js/dashboard.js"></script>

</body>

</html>
