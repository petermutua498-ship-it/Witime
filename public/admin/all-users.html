<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>WiTime - All Users</title>

    <link rel="stylesheet" href="/css/users.css">

</head>


<body>

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <img
                src="/images/logo.png"
                alt="WiTime">

            <h2>WiTime</h2>

            <p>Admin Panel</p>

        </div>


        <nav class="menu">

            <a href="/admin/dashboard.html">
                🏠 Dashboard
            </a>

            <a href="/admin/packages.html">
                📦 Packages
            </a>

            <a href="/admin/users.html">
                👥 Users
            </a>

            <a
                href="/admin/all-users.html"
                class="active">

                👥 All Users

            </a>

            <a href="/admin/payments.html">
                💳 Payments
            </a>

            <a href="/admin/reports.html">
                📈 Reports
            </a>

            <a href="/admin/settings.html">
                ⚙ Settings
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="header">

            <div>

                <h1>All Users</h1>

                <p>
                    Complete WiTime customer list.
                </p>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="topbar">

            <input
                type="search"
                id="searchAllUsers"
                placeholder="Search phone, package or status...">


            <button id="refreshAllUsers">
                ↻ Refresh
            </button>


            <button id="backUsers">
                ← Users
            </button>

        </div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">

                <strong id="totalUsers">
                    0
                </strong>

                <span>
                    Total Users
                </span>

            </div>


            <div class="summary-card">

                <strong id="onlineUsers">
                    0
                </strong>

                <span>
                    Online
                </span>

            </div>


            <div class="summary-card">

                <strong id="offlineUsers">
                    0
                </strong>

                <span>
                    Offline
                </span>

            </div>

        </div>


        <!-- TABLE -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Package
                        </th>

                        <th>
                            Remaining Time
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            IP Address
                        </th>

                        <th>
                            MAC Address
                        </th>

                        <th>
                            Created
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="allUsersTable">

                    <tr>

                        <td
                            colspan="9"
                            class="empty">

                            Loading users...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </main>

</div>


<script src="/js/all-users.js"></script>

</body>

</html>
