<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WiTime - Users</title>

<link rel="stylesheet" href="/css/users.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

   <!-- Sidebar -->

<aside class="sidebar">

    <div class="logo">

        <img src="/images/logo.png" alt="WiTime">

        <h2>WiTime</h2>

        <p>Admin Panel</p>

    </div>


    <ul>

        <li onclick="location.href='dashboard.html'">
            🏠 Dashboard
        </li>

        <li onclick="location.href='packages.html'">
            📦 Packages
        </li>

        <li class="active">
            👥 Users
        </li>

        <li onclick="location.href='payments.html'">
            💳 Payments
        </li>

        <li onclick="location.href='reports.html'">
            📈 Reports
        </li>

        <li onclick="location.href='settings.html'">
            ⚙ Settings
        </li>

    </ul>

</aside>


<!-- Main -->

<main class="main">

    <div class="header">

        <div>

            <h1>User Manager</h1>

            <p class="page-subtitle">
                Manage connected and registered WiFi users
            </p>

        </div>


        <button
            id="refreshUsers"
            class="primary-btn">

            🔄 Refresh

        </button>

    </div>


    <!-- Search -->

    <div class="toolbar">

        <input
            type="text"
            id="searchUser"
            placeholder="Search phone or package...">

    </div>


    <!-- Users Table -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Phone</th>

                    <th>Package</th>

                    <th>Remaining</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="userTable">

                <tr>

                    <td
                        colspan="5"
                        class="empty">

                        Loading users...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- View All -->

    <div class="view-all-container">

        <button
            id="viewAllUsers"
            class="view-all-btn"
            style="display:none;">

            View All Users

        </button>

    </div>

</main>
