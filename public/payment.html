<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiTime Payment</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <div class="logo-circle">
            WT
        </div>

        <h1>WiTime Payment</h1>

        <p class="tagline">
            Complete your payment to access the internet.
        </p>

    </div>

    <div class="package">

        <h3>Selected Package</h3>

        <br>

        <p id="packageName"></p>

        <h2 id="packagePrice"></h2>

        <span id="packageDuration"></span>

    </div>

    <br>

    <div class="welcome">

        <label><strong>Safaricom Phone Number</strong></label>

        <br><br>

        <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
            maxlength="10"
            style="
                width:100%;
                padding:15px;
                border-radius:10px;
                border:1px solid #ccc;
                font-size:18px;
            "
        >

        <br><br>

        <button id="payBtn" class="buy-btn">
            Pay with M-Pesa
        </button>

    </div>

</div>

<script src="js/payment.js"></script>

</body>
</html>
