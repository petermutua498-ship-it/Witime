<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiTime Admin Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            <div class="circle">WT</div>
            <h2>WiTime</h2>
        </div>

        <ul>
            <li class="active">🏠 Dashboard</li>
            <li>📦 Packages</li>
            <li>💳 Payments</li>
            <li>👥 Users</li>
            <li>📶 Sessions</li>
            <li>📈 Reports</li>
            <li>⚙ Settings</li>
            <li>🚪 Logout</li>
        </ul>

    </aside>

    <main class="content">

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Today's Revenue</h3>
                <p>KES 0</p>
            </div>

            <div class="card">
                <h3>Active Users</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Pending Payments</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Active Sessions</h3>
                <p>0</p>
            </div>

        </div>

        <div class="table">

            <h2>Recent Payments</h2>

            <table>

                <tr>
                    <th>Phone</th>
                    <th>Package</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td colspan="4">No payments yet.</td>
                </tr>

            </table>

        </div>

    </main>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
