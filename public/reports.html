<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WiTime - Reports</title>

<link rel="stylesheet" href="css/reports.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">

            <img src="images/logo.png">

            <h2>WiTime</h2>

            <p>Fast • Affordable • Reliable</p>

        </div>

        <ul>

            <li onclick="location.href='dashboard.html'">🏠 Dashboard</li>

            <li onclick="location.href='packages.html'">📦 Packages</li>

            <li onclick="location.href='users.html'">👥 Users</li>

            <li onclick="location.href='payments.html'">💳 Payments</li>

            <li class="active">📈 Reports</li>

            <li onclick="location.href='settings.html'">⚙ Settings</li>

            <li>🚪 Logout</li>

        </ul>

    </aside>

    <main class="main">

        <div class="header">

            <h1>Reports</h1>

            <button id="exportBtn">

                Export CSV

            </button>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Today's Revenue</h3>

                <h2 id="todayRevenue">KES 0</h2>

            </div>

            <div class="card">

                <h3>This Month</h3>

                <h2 id="monthRevenue">KES 0</h2>

            </div>

            <div class="card">

                <h3>Total Revenue</h3>

                <h2 id="totalRevenue">KES 0</h2>

            </div>

        </div>

        <div class="table-card">

            <h2>Package Sales</h2>

            <table>

                <thead>

                    <tr>

                        <th>Package</th>

                        <th>Sales</th>

                        <th>Revenue</th>

                    </tr>

                </thead>

                <tbody id="reportTable">

                    <tr>

                        <td colspan="3" style="text-align:center;">

                            No report available.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="js/reports.js"></script>

</body>

</html>
