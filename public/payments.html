<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WiTime - Payments</title>

<link rel="stylesheet" href="css/payments.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <img src="images/logo.png" alt="WiTime Logo">

            <h2>WiTime</h2>

            <p>Fast • Affordable • Reliable</p>

        </div>

        <ul>

            <li onclick="location.href='dashboard.html'">
                🏠 Dashboard
            </li>

            <li onclick="location.href='packages.html'">
                📦 Packages
            </li>

            <li onclick="location.href='users.html'">
                👥 Users
            </li>

            <li class="active">
                💳 Payments
            </li>

            <li onclick="location.href='reports.html'">
                📈 Reports
            </li>

            <li onclick="location.href='settings.html'">
                ⚙ Settings
            </li>

            <li>
                🚪 Logout
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <!-- Header -->

        <div class="header">

            <h1>Payments</h1>

            <button id="refreshBtn">

                🔄 Refresh

            </button>

        </div>

        <!-- Summary Cards -->

        <div class="cards">

            <div class="card">

                <h3>Total Payments</h3>

                <h2 id="totalPayments">0</h2>

            </div>

            <div class="card">

                <h3>Today's Revenue</h3>

                <h2 id="todayRevenue">KES 0</h2>

            </div>

            <div class="card">

                <h3>Pending Payments</h3>

                <h2 id="pendingPayments">0</h2>

            </div>

        </div>

        <!-- Search -->

        <div class="toolbar">

            <input
            type="text"
            id="searchBox"
            placeholder="Search phone or receipt number...">

            <select id="statusFilter">

                <option value="">All Status</option>

                <option value="Success">Success</option>

                <option value="Pending">Pending</option>

                <option value="Failed">Failed</option>

            </select>

        </div>

        <!-- Payments Table -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>Phone</th>

                        <th>Package</th>

                        <th>Amount</th>

                        <th>Status</th>

                        <th>Receipt</th>

                        <th>Date</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="paymentsTable">

                    <tr>

                        <td colspan="7" style="text-align:center;">

                            No payments found.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="js/payments.js"></script>

</body>

</html>
