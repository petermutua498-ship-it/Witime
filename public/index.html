<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WiTime</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="watermark">
WiTime
</div>

<div class="landing">

    <div class="brand">

        <div class="brand">
            <img src="/images/logo.png" class="logo" alt="WiTime Logo">
        </div>

    </div>

    <div class="welcome">

        <h2>Welcome to WiTime</h2>

        <p>
            Choose an internet package to begin browsing.
        </p>

    </div>

    <!-- Packages -->

    <div id="packages" class="package-grid">

    </div>

    <!-- Payment Section -->

   <div id="paymentSection" class="payment-card" style="display:none;">

    <h2>Complete Payment</h2>

    <div class="payment-details">

        <div class="detail-row">

            <span>Package</span>

            <strong id="selectedPackage"></strong>

        </div>

        <div class="detail-row">

            <span>Price</span>

            <strong id="selectedPrice"></strong>

        </div>

    </div>

    <input
        id="phone"
        type="text"
        placeholder="07XXXXXXXX">

    <button id="payBtn">

        Pay with M-Pesa

    </button>

</div>

    <!-- Waiting -->

    <div id="waitingSection" style="display:none;">

    <div class="waiting-card">

        <div class="loader"></div>

        <h2>Waiting for Payment</h2>

        <p>

            Check your phone and enter your M-Pesa PIN.

        </p>

        <small>

            This page will update automatically.

        </small>

    </div>

</div>

    <!-- Success -->

    <div id="successSection" style="display:none;">

    <div class="success-card">

        <div class="success-icon">

            ✔

        </div>

        <h2>Payment Successful</h2>

        <p>

            Connecting you to Internet...

        </p>

    </div>

</div>

</div>

<script src="js/index.js"></script>

</body>

</html>
