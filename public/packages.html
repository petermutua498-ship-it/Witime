<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WiTime - Packages</title>

<link rel="stylesheet" href="css/packages.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <img src="images/logo.png" alt="Logo">

            <h2>WiTime</h2>

            <p>Admin Panel</p>

        </div>

        <ul>

            <li onclick="location.href='dashboard.html'">
                🏠 Dashboard
            </li>

            <li class="active">
                📦 Packages
            </li>

            <li onclick="location.href='users.html'">
                👥 Users
            </li>

            <li onclick="location.href='payments.html'">
                💳 Payments
            </li>

            <li onclick="location.href='reports.html'">
                📈 Reports
            </li>

            <li onclick="location.href='settings.html'">
                ⚙ Settings
            </li>

            <li>
                🚪 Logout
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <div class="header">

            <h1>Package Manager</h1>

            <button id="addPackageBtn" class="primary-btn">

                + Add Package

            </button>

        </div>

        <div class="toolbar">

            <input
                type="text"
                id="searchPackage"
                placeholder="Search package...">

        </div>

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>Package</th>
                        <th>Price</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="packageTable">

                    <tr>

                        <td colspan="5">

                            Loading packages...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<!-- Modal -->

<div id="packageModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2>Add Package</h2>

        <input
            id="packageName"
            type="text"
            placeholder="Package Name">

        <input
            id="packagePrice"
            type="number"
            placeholder="Price">

        <input
            id="packageDuration"
            type="number"
            placeholder="Duration">

        <select id="durationUnit">

            <option>Minutes</option>
            <option selected>Hours</option>
            <option>Days</option>
            <option>Weeks</option>
            <option>Months</option>

        </select>

        <select id="packageStatus">

            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>

        </select>

        <button id="savePackage">

            Save Package

        </button>

    </div>

</div>

<script src="js/packages.js"></script>

</body>

</html>
