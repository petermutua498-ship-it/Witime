<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Packages - WiTime</title>

<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/packages.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <img src="../images/logo.png" alt="WiTime">

            <h2>WiTime</h2>

        </div>

        <ul>

            <li onclick="location.href='dashboard.html'">
                🏠 Dashboard
            </li>

            <li class="active">
                📦 Packages
            </li>

            <li onclick="location.href='users.html'">
                👥 Users
            </li>

            <li onclick="location.href='payments.html'">
                💳 Payments
            </li>

            <li onclick="location.href='reports.html'">
                📈 Reports
            </li>

            <li onclick="location.href='settings.html'">
                ⚙ Settings
            </li>

            <li>
                🚪 Logout
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <div class="header">

            <h1>Package Manager</h1>

            <button id="addPackageBtn" class="primary-btn">

                + Add Package

            </button>

        </div>

        <!-- Search -->

        <div class="search-area">

            <input

                type="text"

                id="searchPackage"

                placeholder="Search packages..."

            >

        </div>

        <!-- Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Package</th>

                        <th>Price</th>

                        <th>Duration</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="packageTable">

                    <tr>

                        <td colspan="5" class="empty">

                            Loading packages...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<!-- Modal -->

<div id="packageModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">&times;</span>

        <h2 id="modalTitle">

            Add Package

        </h2>

        <input
            type="hidden"
            id="packageId">

        <input
            type="text"
            id="packageName"
            placeholder="Package Name">

        <input
            type="number"
            id="packagePrice"
            placeholder="Price">

        <input
            type="number"
            id="packageDuration"
            placeholder="Duration">

        <select id="durationUnit">

            <option>Minutes</option>

            <option selected>Hours</option>

            <option>Days</option>

            <option>Weeks</option>

            <option>Months</option>

        </select>

        <select id="packageStatus">

            <option selected>Active</option>

            <option>Inactive</option>

        </select>

        <button id="savePackage" class="primary-btn">

            Save Package

        </button>

    </div>

</div>

<!-- Toast -->

<div id="toast"></div>

<script src="../js/packages.js"></script>

</body>

</html>
