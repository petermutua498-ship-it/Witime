<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiTime Admin Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="header">

<div class="logo-circle">
WT
</div>

<h1>WiTime Admin</h1>

<p class="tagline">
Administrator Login
</p>

</div>

<div class="welcome">

<input
type="text"
id="username"
placeholder="Username"
autocomplete="username">

<br><br>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">

<br><br>

<button class="buy-btn" id="loginBtn">
Login
</button>

</div>

</div>

<script src="js/admin-login.js"></script>

</body>
</html>
