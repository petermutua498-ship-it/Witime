<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WiTime | Connected</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="watermark">

WiTime

</div>

<div class="connected-page">

    <!-- Logo -->

    <div class="brand">

        <img src="images/logo.png" class="logo">

        <div class="brand-text">

            <h1>WiTime</h1>

            <p>Fast • Affordable • Reliable</p>

        </div>

    </div>

    <!-- Status Card -->

    <div class="status-card">

        <div class="online-dot"></div>

        <h2>Connected Successfully</h2>

        <p>You now have internet access.</p>

    </div>

    <!-- User Card -->

    <div class="info-card">

        <div class="row">

            <span>📱 Phone</span>

            <strong id="phoneNumber"></strong>

        </div>

        <div class="row">

            <span>📦 Package</span>

            <strong id="packageName">Loading...</strong>

        </div>

        <div class="row">

            <span>⏳ Time Remaining</span>

            <strong id="countdown">--:--:--</strong>

        </div>

    </div>

    <!-- Buttons -->

    <div class="button-group">

        <button id="buyMore">

            Buy More Time

        </button>

        <button id="disconnect">

            Disconnect

        </button>

    </div>

</div>

<script src="js/connected.js"></script>

</body>

</html>
