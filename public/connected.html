<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WiTime - Connected</title>

<link rel="stylesheet" href="css/connected.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="success">

            ✅

        </div>

        <h1>Payment Successful</h1>

        <p class="subtitle">

            You are now connected to WiTime.

        </p>

        <div class="details">

            <div class="row">

                <span>Phone Number</span>

                <strong id="phone">
                    Loading...
                </strong>

            </div>

            <div class="row">

                <span>Package</span>

                <strong id="package">
                    Loading...
                </strong>

            </div>

            <div class="row">

                <span>Connected At</span>

                <strong id="connectedAt">
                    Loading...
                </strong>

            </div>

            <div class="row">

                <span>Expires At</span>

                <strong id="expiresAt">
                    Loading...
                </strong>

            </div>

            <div class="row">

                <span>Time Remaining</span>

                <strong id="remainingTime">

                    00:00:00

                </strong>

            </div>

            <div class="row">

                <span>Status</span>

                <strong class="connected">

                    🟢 Connected

                </strong>

            </div>

        </div>

        <button
        id="buyAgain">

            Buy Another Package

        </button>

    </div>

</div>

<script src="js/connected.js"></script>

</body>

</html>
